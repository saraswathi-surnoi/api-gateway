spring.application.name=api-gateway
server.port=8080

# Eureka Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Optional: log requests
logging.level.org.springframework.cloud.gateway=DEBUG

# User Profile Route
spring.cloud.gateway.routes[0].id=user-profile-service
spring.cloud.gateway.routes[0].uri=lb://user-profile-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-profile/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
#spring.cloud.gateway.routes[0].predicates[0]=Path=/education/**,/personalDetails/**,/user/**,/api/user-documents/**,/api/skills/**,/workExperience/**
#spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# Job Recruiter Route
spring.cloud.gateway.routes[1].id=job-recruiter-service
spring.cloud.gateway.routes[1].uri=lb://job-recruiter-service
#spring.cloud.gateway.routes[1].predicates[0]=Path=/job-recruiter/**
#spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobAdmin**,/api/jobs/**,/api/applications**,/api/interviews/**,/api/jobquiz/**,/api/recruiters/**,/api/feedback/**,/api/savedJobs/**,/api/shortlisted/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

#Course Learning Route
spring.cloud.gateway.routes[2].id=course-learning-service
spring.cloud.gateway.routes[2].uri=lb://course-learning-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/course-learning/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# Enable Eureka-based service discovery for routes
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true

#Enable Eureka-based service discovery for routes
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true